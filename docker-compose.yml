services:
  mongodb:
    image: mongo:latest
    container_name: civicvoice-db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always

  api:
    build: .
    container_name: civicvoice-api
    ports:
      - "3005:3005"
    depends_on:
      - mongodb
    environment:
      - PORT=3005
      - DB_URI=mongodb://mongodb:27017/civicvoice
      - JWT_SECRET=change_me_in_production_12345
      - JWT_REFRESH_SECRET=change_me_too_secret_6789
      - CORS_ORIGIN=http://localhost:5173
      - NODE_ENV=production
    restart: always

volumes:
  mongodb_data: